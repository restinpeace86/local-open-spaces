name: Daily Data Ingestion (TourAPI 4.0)

# implementation/todo.md Task 2: KorService2/KorWithService2/KorPetTourService2/GoCamping
# 4개 소스는 modifiedtime 증분 파라미터가 Exact Match(=)로만 동작하거나(KorXxxService2)
# 날짜 필터를 지원하지 않아(GoCamping) Range 기반 증분 수집이 불가능함을 실측으로 확인함.
# 따라서 매일 1회 전량 수집(Full Ingest) 후 upsert(onConflict: external_id)로 최신화한다.
# KST 04:00 = UTC 19:00(전일).
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  ingest-tourapi-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: KorService2 - 국문 관광정보 (관광지/문화시설/레포츠)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/kor-tour.mjs

      - name: KorWithService2 - 무장애 여행 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/kor-with-tour.mjs

      - name: KorPetTourService2 - 반려동물 동반여행 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/kor-pet-tour.mjs

      - name: GoCamping - 고캠핑 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/go-camping.mjs

      # Task 1(detailIntro2 지연 상세 수집)은 quota 예산(최대 900건/회) 및 응답 시간이 커서
      # 이 Full Ingest 배치에는 포함하지 않는다. 필요 시 `--with-detail` 플래그로 수동/별도
      # 스케줄 실행한다 (예: node scripts/ingest/kor-tour.mjs --with-detail).

name: Mom's Pick Push Send Batch (Daily Morning)

# [Decision 019](2026-09-02) / spec/community/mom-pick-grades.md 2.5: 우수맘 이상 "매일
# 아침(주말 포함) 맞춤형 앱 푸시 알람"을 실제로 발송한다. 등급 재계산 배치
# (mom-pick-grade-batch.yml)가 먼저 그날의 최신 등급을 반영해야 하므로 그 이후 시각으로
# 스케줄한다 — grade batch가 KST 04:23, 이 배치는 KST 07:30(UTC 22:30, 전일)로 "아침"
# 시간대에 맞춘다. 매일 실행하며 요일 조건을 따로 두지 않는다 — "주말 포함"을 "주말에도
# 쉬지 않고 매일"로 해석했다(원문이 평일/주말을 다른 형태로 요구한다는 근거가 없어
# 새로운 주중/주말 분기 로직을 추측으로 만들지 않는다, 제3장 제5조).
permissions:
  contents: read

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  mom-pick-push-send-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Send Mom's Pick push notifications (우수맘 이상, 반경 내 신규 스팟/행사)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/ingest/mom-pick-push-send-batch.mjs

name: E2E Tests (Playwright)

# implementation/todo.md: 핵심 사용자 시나리오 E2E 통합 테스트를 PR/main 푸시마다 검증한다.
# tests/e2e/support/mocks.ts에서 Supabase RPC 및 Kakao Maps SDK 네트워크 호출을 라우트 가로채기로
# 완전히 대체하므로(Zero-Cost 원칙, project/decision-log.md Decision 001), 실제 API 키 없이
# 플레이스홀더 값만으로 결정론적으로 실행된다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_KAKAO_MAP_API_KEY: placeholder-kakao-key
      CI: true
    steps:
      - uses: actions/checkout@v4

      # [핵심 events 수집 파이프라인 장애 점검](2026-08-30 사용자 지시) 실측 발견: 최근 GitHub
      # Actions 실행이 전부 "Node.js detected but native WebSocket not found" 크래시로
      # 실패하고 있음을 docs/pipeline-log.md에서 확인했다 — `npm view @supabase/supabase-js
      # engines`로 직접 조회한 결과 이 라이브러리(현재 설치 버전 2.112.3)가
      # `"engines": {"node": ">=22.0.0"}`를 명시하는 것을 확인, Node 20에서는 native
      # WebSocket이 없어 Supabase 클라이언트 생성 자체가 크래시한다. 세 워크플로(daily/
      # monthly/e2e) 모두 동일하게 Node 20을 쓰고 있어 함께 올린다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

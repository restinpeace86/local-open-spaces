name: Homeplus Lecture List Batch (Python/Playwright)

# [홈플러스 강좌 리스트 수집 중단](2026-10-02 사용자 지시: "홈플러스쪽은
# 일단 중단해 배치도 하지마.. 여기 문화센터 서비스 중단했대") — 홈플러스가
# 문화센터 서비스 자체를 중단했다는 사용자 확인에 따라 크론 스케줄을
# 제거하고, 수동 실행(workflow_dispatch)도 `if: false`로 즉시 종료되게
# 막아둔다. 데이터 원천이 사라졌으니 재개할 이유가 없다 — 다시 운영하게
# 될 경우를 대비해 코드/워크플로 자체는 삭제하지 않고 남겨둔다.
#
# [중단 전 이력 — 참고용] 아래는 자동화를 만들 때의 설계 기록이다(더 이상
# 유효하지 않음, 삭제하지 않고 남겨둠):
# 기존 ingest-daily/ingest-monthly(Node.js 오케스트레이터)와는 완전히
# 별도였다. 이 소스만 로그인 세션(카카오 OAuth) 기반이라 Node 배치에
# 편입할 수 없어 Python/Playwright로 따로 돌았다. state.json은 API 키가
# 아니라 사용자의 실제 카카오 로그인 세션 쿠키였고(secrets.HOMEPLUS_STATE_JSON),
# 세션 만료 시 pipeline_logs에 FAILED(세션 만료) 상태를 남기고 관리자
# 화면에 재로그인 안내 배너를 띄우는 구조였다. 크론은 KST 새벽 3시 20분
# (UTC 18:20)이었다.
on:
  workflow_dispatch:

jobs:
  homeplus-lecture-list-batch:
    if: false
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # [세션 복원] secrets.HOMEPLUS_STATE_JSON은 homeplus-save-login-session.py가
      # 로컬에서 만든 state.json 파일 내용을 그대로 저장소 Secret에 붙여넣은 것.
      - name: Restore Homeplus login session
        run: echo '${{ secrets.HOMEPLUS_STATE_JSON }}' > state.json

      # [가벼운 1회 재시도] ingest-daily.yml의 15분 대기 재시도는 네트워크 전체
      # 장애를 흡수하기 위한 것이라 이 배치(실행 시간 2~3분 수준, 더 가벼움)에는
      # 과하다 — 선택자/타이밍성 일시 실패만 흡수하면 충분해 짧게(2분) 대기 후
      # 1회만 재시도한다.
      - name: Run Homeplus lecture list collection
        run: |
          set +e
          python scripts/python/homeplus-collect-lecture-list.py
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "⚠️ 1차 실행 실패(exit $exit_code) — 2분 대기 후 1회 재시도합니다."
            sleep 120
            python scripts/python/homeplus-collect-lecture-list.py
            exit_code=$?
          fi
          exit $exit_code

      - name: Remove restored session file
        if: always()
        run: rm -f state.json

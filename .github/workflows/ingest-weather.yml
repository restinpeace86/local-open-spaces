name: Weather Ingestion (KMA 6-Hourly Batch)

# [기상청 날씨 데이터 수집 3시간 주기 배치(Cron) 파이프라인 연동](2026-09-01 사용자 지시):
# 직전에 구축한 기상청 단기예보 어댑터(scripts/ingest/adapters/kma-weather-adapter.mjs)를
# 3시간마다 실행해 전국 스팟의 spot_weather_caches를 갱신한다. daily/monthly 배치와 달리
# 소스가 KMA_WEATHER 하나뿐이라(run-daily.mjs/run-monthly.mjs 같은 다중 소스 오케스트레이터가
# 필요 없음) 어댑터의 CLI 진입점을 그대로 실행 대상으로 삼는다(제5장 제4조 기존 구조 우선 —
# 불필요한 오케스트레이터 계층을 새로 만들지 않음).
#
# [하루 8회 → 4회 감축](2026-09-21 사용자 지시): "지금 기상청 데이터 가져오는게
# 3시간마다인데 계속 fail 뜨는거 같아 내 gmail로 fail 계속 오고있어" — 원인 조사 결과
# 전국 EXACT 스팟(140,757건)을 5km 격자로 묶어도 고유 격자가 3,946개라, 하루 8회
# 실행 시 기상청 단기예보 API(PUBLIC_DATA_API_KEY 공유 키) 호출이 하루 약 31,568건
# 필요했다 — 실측 재현 결과 이 계정의 승인된 일일 한도를 훨씬 초과해 매 실행마다
# "LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR"(일일 서비스 요청제한 횟수
# 초과)로 전체 격자가 실패하고 있었다. 사용자가 "하루 6시간 배치로 해서 8회에서
# 4회로 줄이자 00시 06시 12시 18시"로 확정 — 기상청 단기예보 발표 시각은
# 02/05/08/11/14/17/20/23시(KST) 8개뿐이라(고정 발표 주기, 임의 시각 선택 불가)
# 그중 사용자가 말한 00/06/12/18시에 가장 가까운(각 -1시간) 05/11/17/23시(KST)를
# 골랐다. "정각 트리거 회피 + 스탬피드 방지"용 47분 오프셋은 기존 그대로 유지.
#
# [Cron 스케줄 — 이번엔 KST/UTC가 우연히 일치하지 않음] 원래 8개 값 전체는 KST
# 오프셋(9시간)이 발표 주기(3시간)의 배수라 KST로 읽든 UTC로 읽든 같은 집합이었지만,
# 이번에 고른 4개 값 {5,11,17,23}은 그 대칭이 깨진다(6시간 간격 부분집합이라 9시간
# 이동에 대해 닫혀 있지 않음 — 직접 계산 검증: KST 05:47/11:47/17:47/23:47은 UTC로
# 20:47(전날)/02:47/08:47/14:47이 된다). 그래서 이번엔 daily/monthly 배치와 동일하게
# UTC로 명시적으로 변환한 값(2,8,14,20)을 쓴다.
#
# [잔여 위험 고지] 4회로 줄여도 하루 호출량은 여전히 약 15,784건(3,946격자×4회)으로,
# 공공데이터포털의 일반적인 미승인 개발계정 한도(보통 1,000~10,000건/일)보다 클 수
# 있다 — 이 변경은 사용자가 지시한 "즉시 완화" 조치이며, 완전한 해결에는 여전히
# 공공데이터포털에서 이 API(기상청 단기예보 조회서비스)의 트래픽 한도 증량 신청이
# 필요할 수 있다(외부 조치, 코드로 해결 불가).
#
# [추가 완화 — 북부 지역으로 스팟 범위 축소](2026-09-21 사용자 지시): "api 트래픽
# 한도 관련 10000건으로 보고 더 줄여보자 스팟을 일단 서울 경기 강원 쪽하고 그
# 아래까지 해서 북부쪽으로 해봐." 위 잔여 위험(하루 약 15,784건)이 실제로 사용자가
# 가정한 일일 한도(10,000건)를 넘는다고 판단해, 어댑터에 지역 필터를 추가했다.
# 실측(운영 DB 직접 조회): 전국 EXACT 스팟 140,757건 중 북부(서울/인천/경기/강원/
# 충북/충남/대전/세종) 86,667건만 대상으로 하면 고유 5km 격자가 3,946개→1,740개로
# 줄어 하루 호출량이 약 6,960건(1,740격자×4회)까지 내려간다 — 10,000건에 여유 있게
# 들어온다. 상세: `scripts/ingest/lib/province-region.mjs`,
# `implementation/2026-09-21-weather-batch-northern-region-scope.md` 참고.
# `WEATHER_BATCH_REGION_SCOPE=nationwide`로 env var 하나만 바꾸면 코드 수정 없이
# 전국 범위로 되돌릴 수 있다(공공데이터포털 한도 증량이 승인되는 등 사정이 바뀔 경우
# 대비 — 이 축소는 임시 완화 조치이지 영구적인 제품 범위 결정이 아니다).
#
# [docs/pipeline-log.md에 기록하지 않는 이유]: 기존 recordBatchRun()/splitTableCounts()는
# "외부 카탈로그를 훑어 events/open_spaces에 신규 행을 upsert"하는 배치를 위해 설계된
# 표 포맷(RAW 수신 vs events/open_spaces 적재 vs 드롭 검증)이라, 이 배치가 다루는
# spot_weather_caches(격자 단위 날씨 캐시 갱신)의 의미와 근본적으로 다르다 — 억지로 끼워
# 맞추면 "open_spaces 적재 건수" 칸에 날씨 캐시 건수가 찍혀 오히려 오해를 부른다. 요구사항
# 5가 "콘솔 또는 시스템 로거"를 명시적으로 허용하므로, 어댑터 run()이 이미 남기는 구조화된
# 콘솔 로그(배치 시작/종료, 총 격자 수, 성공·실패 격자 수, 소요 시간)를 GitHub Actions 자체
# 실행 로그(Actions 탭에서 매 실행 확인 가능)로 남기는 것으로 충분하다고 판단했다 — 하루
# 4회(2026-09-21 감축 후) 주기로 매번 리포지토리에 로그 커밋을 남기면(daily/monthly
# 대비 여전히 훨씬 잦은 빈도) 불필요한 git 노이즈만 커진다.
#
# [재시도 없이 단발 실행]: daily/monthly는 "하루/한달에 한 번"이라 실패 시 15분 대기 후
# 1회 재시도하는 안전장치를 뒀지만, 이 배치는 자동으로 다시 돈다(2026-09-21부터 6시간
# 주기) — 한 번 실패해도 최대 6시간 뒤 다음 주기가 스스로 복구하므로 워크플로 레벨
# 재시도는 불필요한 복잡도다. 다만 할당량 초과처럼 "다음 주기에도 계속 실패하는" 경우는
# 이 자동 복구로 해결되지 않는다는 점에 유의(위 [잔여 위험 고지] 참고).
permissions:
  contents: read

on:
  schedule:
    # UTC 2,8,14,20시 47분 = KST 11,17,23,05시 47분(4회/일). 위 주석 "이번엔 KST/UTC가
    # 우연히 일치하지 않음" 참고 — 이 값들은 KST 시각을 그대로 옮겨 적은 게 아니다.
    - cron: '47 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  weather-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [핵심 events 수집 파이프라인 장애 점검](2026-08-30 사용자 지시) 실측 발견과 동일한
      # 사유(@supabase/supabase-js 2.112.3의 engines가 node >=22.0.0을 요구) — 상세 배경은
      # ingest-daily.yml 상단 주석 참고.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: KMA Weather Batch (북부 지역 EXACT 스팟 → spot_weather_caches)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          # 'nationwide'로 바꾸면 전국 범위로 되돌아간다(코드 수정 불필요) — 위 "추가
          # 완화" 주석 참고. 기본값(어댑터의 resolveRegionScope())도 'northern'이라
          # 이 줄을 지워도 동일하게 동작하지만, 지금의 완화 조치를 워크플로 파일만
          # 봐도 바로 알 수 있도록 명시적으로 남겨둔다.
          WEATHER_BATCH_REGION_SCOPE: northern
        run: node scripts/ingest/adapters/kma-weather-adapter.mjs

name: Classify New Events Facility Type (Daily)

# [실내/야외 분류 LLM 파이프라인 — 매일 신규분](2026-09-17 사용자 지시): "매일 새로
# 들어오는거에 대하여 돌수 있도록 배치로 만들어줄수 있나? 일단 오늘 신규 반영된
# 건들에 한해서" — 그날(KST) 새로 생성된 events 행 중 is_active=true AND
# target_audience IN (INFANT/KIDS_PRE/KIDS_SCHOOL/FAMILY)에 해당하는 것만 매일
# Gemini로 실내/야외(facility_type)를 판단해 저장한다. 과거 누적 708건을 한 번에
# 처리하는 백필(scripts/classify-events-facility-type.mjs)과는 별개로, 이 배치는
# 앞으로 매일 새로 들어오는 건만 담당한다.
#
# [스케줄](2026-09-18 사용자 지시 수정: "순서는 배치끝나고 테이블에저장된후
# 실행해야돼. 배치 돌면서 실행하면 안되고") — 고정 시각(KST 04:05) 추측 대신, 일일
# 수집 배치(ingest-daily.yml, name: "Daily Ingestion (Events Batch)")가 실제로
# 완료(성공)된 직후에만 실행되도록 workflow_run 트리거로 연결한다. 일일 수집
# 배치는 실패 시 15분 대기 후 1회 재시도까지 포함해 소요 시간이 날마다 달라질 수
# 있어(제3장 제5조 추측 금지 — 고정 버퍼 시간으로는 순서를 보장할 수 없음),
# GitHub Actions의 workflow_run(types: completed)으로 "그 워크플로가 끝난 시점"
# 자체를 트리거로 삼는다. conclusion == 'success'로 제한해, 일일 수집이 실패로
# 끝난 날에는(target_audience 등이 온전히 채워졌다고 보장할 수 없으므로) 이
# 분류 배치도 함께 건너뛴다.
#
# [Gemini 할당량 공유 주의](2026-09-17 실측): 이 워크플로는 ingest-daily.yml의
# 카테고리 분류(scripts/ingest/lib/ai-tagging.mjs)와 같은 GEMINI_API_KEY, 같은
# 무료 티어 일일 500회/모델 한도를 공유한다. 신규 유입분만 대상이라 건수가 적을
# 것으로 예상되지만, 스크립트 자체에 분당/일일 한도 대응(순차 실행 + 백오프 +
# 연속 실패 시 조기 중단)이 이미 포함돼 있다.
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Daily Ingestion (Events Batch)"]
    types: [completed]
  workflow_dispatch:

jobs:
  classify-new-events-facility-type:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Classify today's newly-added events (실내/야외 LLM 분류)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ingest/classify-new-events-facility-type.mjs

name: Weekly Ingestion (Spaces Batch)

# [배치 자동화 및 로깅 체계 확정](2026-08-25): 코드 분석 기반 분류 — open_spaces 테이블로만
# 적재하는(events와 무관한) API 전체를 scripts/ingest/run-weekly.mjs 한 번의 실행으로 순차
# 처리한다. 분류 근거(각 파일의 targetTable을 직접 조사)는 run-weekly.mjs 상단 주석 참고.
#
# 이 워크플로는 기존 ingest-monthly.yml(월 1회, 7개 스텝)과 ingest-tourapi-daily.yml(매일,
# TourAPI 4개 스텝)을 대체·통합한다 — 두 워크플로 모두 open_spaces 전용 API만 다뤘는데
# 스케줄 주기가 서로 달랐다(고정 장소/시설 데이터는 변동 주기가 길다는 전제 자체는 동일).
# 이번 지시("events면 Daily, open_spaces 전용이면 Weekly")에 따라 스케줄을 주간으로
# 통일한다. KorTour/GoCamping 계열 4종은 증분 수집 파라미터를 지원하지 않아(실측 확인,
# implementation/todo.md Task 2) 매회 전량 재수집(Full Ingest) 방식을 그대로 유지한다.
#
# 매주 일요일 04:00 KST = 토요일 19:00 UTC.
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

jobs:
  weekly-spaces-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Weekly Spaces Batch (CITY_PARK/CULTURE_FACILITY/CULTURAL_FACILITY_SUMMARY/LOCALDATA_AMUSEMENT/GG_EVENTS/GO_CAMPING/NATIONAL_PARK_ECOTOUR/LOCALDATA_PLAYGROUND/PUBLIC_FACILITY_OPEN/SWIMMING_POOL/KOR_TOUR/KOR_WITH_TOUR/KOR_PET_TOUR)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/ingest/run-weekly.mjs

name: Daily Ingestion (Events Batch)

# [배치 자동화 및 로깅 체계 확정](2026-08-25): 코드 분석 기반 분류 — events 테이블로 적재하는
# API 전체 + events/open_spaces 복합 API(SeoulYeyakAdapter, 행사/접수 상태 갱신을 위해
# 반드시 Daily 포함)를 scripts/ingest/run-daily.mjs 한 번의 실행으로 순차 처리한다.
# 분류 근거(각 파일의 targetTable을 직접 조사)는 run-daily.mjs 상단 주석 참고.
# KST 03:00 = UTC 18:00(전일).
#
# 이전에는 소스별 개별 스텝/여러 cron 트리거로 흩어져 있었으나(서울시 공공서비스예약/문화행사/
# TourAPI 축제/경기 문화행사 4개 스텝), run-daily.mjs 오케스트레이터로 통합하면서 워크플로도
# "Daily 배치 1스텝"으로 단순화했다 — 배치 리포트(docs/pipeline-log.md)도 배치 단위 1건으로
# 남아 실제 실행 단위와 로그 단위가 정확히 일치한다.
# [파이프라인 관측성 긴급 복구](2026-08-28): docs/pipeline-log.md는 run-daily.mjs가 러너
# 로컬 파일 시스템에만 기록하고, 이 워크플로에는 그 변경분을 저장소로 커밋/푸시하는 스텝이
# 전혀 없었다 — 즉 지금까지 이 파일에 남은 모든 기록은 로컬 개발/테스트 실행분이며, 실제
# GitHub Actions 스케줄 실행이 성공했는지조차 사후에 확인할 방법이 없었다(관측성 완전
# 부재). 8/26~28 신규 이벤트 수집 0건 진단 과정에서 발견되어, 실행 후 변경분을 커밋/푸시하는
# 스텝을 추가해 앞으로의 실행 결과를 저장소에서 직접 확인할 수 있도록 한다.
# [cron 정각 트리거 회피](2026-08-28): GitHub Actions 공식 문서 기준 사실 확인 — schedule
# 이벤트는 매 정시(top of the hour)에 부하가 몰려 지연/드롭될 수 있다고 명시돼 있다. 실측
# 확인 결과 `0 18 * * *`(정각)로 등록된 이 워크플로가 8/26·8/27 이틀 연속 단 한 번도
# 트리거되지 않았다(GitHub Actions API로 실행 이력 조회 — 8/25 19:19 실행 이후 8/28 00:36
# 확인 시점까지 신규 실행 0건). 정각을 피해 18:07로 옮겨 재발 가능성을 낮춘다.
# [크론 스케줄 KST 새벽 3시대 재조정](2026-08-28): KST 기준 새벽 3시 07분 (UTC 18:07) —
# 트래픽이 한적한 새벽 시간대 배치 + 정각 회피(비정규 분 단위) 두 조건을 함께 만족한다.
permissions:
  contents: write

on:
  schedule:
    - cron: '7 18 * * *'
  workflow_dispatch:

jobs:
  daily-events-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [핵심 events 수집 파이프라인 장애 점검](2026-08-30 사용자 지시) 실측 발견: 최근 실행이
      # 전부 "Node.js detected but native WebSocket not found"로 실패했다(docs/pipeline-log.md,
      # 2026-08-30 05:52~06:27 UTC 4회 연속 재현) — `@supabase/supabase-js`(설치 버전 2.112.3)의
      # package.json이 `"engines": {"node": ">=22.0.0"}`를 명시함을 `npm view`로 직접
      # 확인했다. Node 20에는 native WebSocket이 없어 Supabase 클라이언트 생성 자체가
      # 크래시한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # [수집 파이프라인 자동 재시도 메커니즘](2026-08-28): 코드 레벨 재시도(scripts/ingest/lib/retry.mjs)는
      # 개별 API 호출/DB 쿼리 단위의 짧은 블립만 흡수한다. DB 전체 장애나 러너 네트워크 단절처럼
      # 프로세스 전체가 죽는 광범위 장애는 워크플로 레벨에서 한 번 더 재시도해야 당일 데이터
      # 유실을 막을 수 있다 — 1차 실패 시 15분(10~20분 범위) 대기 후 전체를 1회 재실행한다.
      # upsert는 external_id 기준 멱등 연산이라 이미 성공한 소스가 재실행돼도 데이터가
      # 중복되거나 손상되지 않는다.
      - name: Daily Events Batch (GG_CULTURE_EVENTS, SEOUL_CULTURE_EVENTS, TOUR_API_FESTIVAL, SEOUL_YEYAK + 좌표 보강)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set +e
          node scripts/ingest/run-daily.mjs
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "⚠️ 1차 실행 실패(exit $exit_code) — 15분 대기 후 1회 재시도합니다."
            sleep 900
            node scripts/ingest/run-daily.mjs
            exit_code=$?
          fi
          exit $exit_code

      # [워크플로 푸시 경합 수정](2026-08-30 실측 발견): main에 다른 커밋이 그 사이 올라오면
      # (이 배치는 15분+ 걸릴 수 있어 그 사이 사람이 작업을 푸시할 여지가 충분하다) 단순
      # `git push`는 non-fast-forward로 거부되고, 러너 워크스페이스는 잡 종료와 함께
      # 사라지므로 이 배치 리포트 자체가 통째로 유실된다(실제로 2026-08-30 발생 확인).
      # docs/pipeline-log.md는 이 워크플로만 건드리는 파일이라 rebase 충돌 위험이 매우
      # 낮다 — 실패 시 최신 main으로 rebase한 뒤 재시도한다.
      - name: Commit pipeline log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/pipeline-log.md; then
            git add docs/pipeline-log.md
            git commit -m "docs: [Actions] Daily Events Batch 실행 리포트 - $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "⚠️ 푸시 실패($i/5) — main이 그 사이 앞서나갔을 수 있어 rebase 후 재시도합니다."
              git fetch origin main
              git rebase origin/main
            done
            echo "❌ 5회 재시도에도 푸시 실패 — 배치 리포트가 저장소에 반영되지 못했습니다."
            exit 1
          else
            echo "docs/pipeline-log.md 변경 없음 — 커밋 스킵"
          fi

name: Daily Data Ingestion (Events)

# spec/data/data_sources.md: 행사·이벤트형 데이터는 매일 1회(03:00~04:30 KST) 동기화.
# KST 03:00/03:30/04:00은 UTC로 전일 18:00/18:30/19:00에 해당한다.
# Task 9-6-4(2026-08-23): tour-api-festival.mjs는 실측 재확인 결과 계정 승인이 이미 완료돼
# 정상 동작함(기존 "보류" 코멘트는 stale — kor-tour.mjs와 동일한 PUBLIC_DATA_API_KEY 사용).
# gg-culture-events.mjs/enrich-gg-culture-event-locations.mjs/gg-splash-events.mjs는 완성돼
# 있었지만 지금까지 어떤 스케줄에도 연결돼 있지 않았다(수동 실행 이력만 존재).
on:
  schedule:
    - cron: '0 18 * * *'  # 03:00 KST - Source 04 서울시 공공서비스예약
    - cron: '30 18 * * *' # 03:30 KST - Source 05/06 서울시 문화행사 정보 + TourAPI 4.0 축제
    - cron: '0 19 * * *'  # 04:00 KST - 경기데이터드림 문화행사 + 위치 보완 + 물놀이형 수경시설
  workflow_dispatch:

jobs:
  ingest-public-reservation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Source 04 - 서울시 공공서비스예약(종합)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
        run: node scripts/ingest/seoul-public-reservation.mjs

  ingest-culture-events:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Source 05 - 서울시 문화행사 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
        run: node scripts/ingest/seoul-culture-events.mjs

      - name: Source 06 - TourAPI 4.0 축제 정보 (searchFestival2)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/tour-api-festival.mjs

      # Source 07(야외행사&팝업)은 별도 수집 없이 Source 04/05 데이터를 필터링해 대체.

  ingest-gg-culture-events:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: 경기데이터드림 문화행사(GGCULTUREVENTSTUS/GGCULFOUEVENSTM)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ingest/gg-culture-events.mjs

      # Task 9-6-5(2026-08-23): KAKAO_REST_API_KEY는 선택 값이다(없어도 VWorld만으로 동작) —
      # GitHub Actions 저장소 Secrets에 별도 등록이 필요하다(로컬 .env.local과 별개).
      - name: 경기데이터드림 문화행사 위치 보완(상세 페이지 스크래핑 EXACT 승격)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/ingest/enrich-gg-culture-event-locations.mjs

      # Task 9-6-4(2026-08-23): 물놀이형 수경시설(여름 한정 설치 공간)은 상시 공간이 아니라
      # 시한성 이벤트로 분류한다(events, 매일 수집) — project/data_sources.md 참고.
      - name: 경기도 물놀이형 수경시설(여름 한정 설치 공간)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/ingest/gg-splash-events.mjs

name: Daily Ingestion (Events Batch)

# [배치 자동화 및 로깅 체계 확정](2026-08-25): 코드 분석 기반 분류 — events 테이블로 적재하는
# API 전체 + events/open_spaces 복합 API(SeoulYeyakAdapter, 행사/접수 상태 갱신을 위해
# 반드시 Daily 포함)를 scripts/ingest/run-daily.mjs 한 번의 실행으로 순차 처리한다.
# 분류 근거(각 파일의 targetTable을 직접 조사)는 run-daily.mjs 상단 주석 참고.
# KST 03:00 = UTC 18:00(전일).
#
# 이전에는 소스별 개별 스텝/여러 cron 트리거로 흩어져 있었으나(서울시 공공서비스예약/문화행사/
# TourAPI 축제/경기 문화행사 4개 스텝), run-daily.mjs 오케스트레이터로 통합하면서 워크플로도
# "Daily 배치 1스텝"으로 단순화했다 — 배치 리포트(docs/pipeline-log.md)도 배치 단위 1건으로
# 남아 실제 실행 단위와 로그 단위가 정확히 일치한다.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  daily-events-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Daily Events Batch (GG_CULTURE_EVENTS, SEOUL_CULTURE_EVENTS, TOUR_API_FESTIVAL, SEOUL_YEYAK + 좌표 보강)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/ingest/run-daily.mjs

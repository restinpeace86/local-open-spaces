name: Lottemart Culture Club Batch

# [롯데마트 문화센터 강좌 리스트 일일 배치](2026-10-04 사용자 지시): "롯데마트 문화센터
# 확인좀 해줘" — 이마트 컬처클럽과 동일하게 로그인/세션/Playwright가 전혀 필요
# 없다(실측 확인: searchList.do는 쿠키 없이도 동일 응답). 다만 이마트와 달리 다중값
# 배치 조회가 안 돼 지점 60 × 대상 3 × 학기 2 = 360개 조합을 순회해야 해서 실행
# 시간이 더 길다 — timeout-minutes를 넉넉히 둔다.
#
# 크론 시간(2026-10-04 사용자 지시: "새벽4시말고 새벽1시라던가 ... 우리 배치들
# 있는거 시간 봐서 좀 분산해서 하자"): 기존 배치 전체의 UTC 크론을 KST로 환산해
# 겹치지 않는 자리를 찾았다 — ingest-daily 02:47, mom-pick-grade 04:23, 이마트
# 컬처클럽 04:00, 이마트 컬처클럽 상세 05:00, ingest-monthly 03:52, ingest-weather
# 05/11/17/23시. KST 새벽 1시(UTC 16:00)가 비어 있어 여기로 잡는다.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  lottemart-culture-club-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # [가벼운 1회 재시도] 이마트/홈플러스/서울 공영주차장과 동일한 사유 — 선택자/
      # 타이밍성이 아니라 외부 서버 일시 장애만 흡수하면 되는 배치라 짧게(2분) 대기
      # 후 1회만 재시도한다.
      - name: Run Lottemart Culture Club collection
        run: |
          set +e
          node scripts/ingest/lottemart-culture-club.mjs
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "⚠️ 1차 실행 실패(exit $exit_code) — 2분 대기 후 1회 재시도합니다."
            sleep 120
            node scripts/ingest/lottemart-culture-club.mjs
            exit_code=$?
          fi
          exit $exit_code

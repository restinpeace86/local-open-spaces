name: Monthly Ingestion (Spaces Batch)

# [배치 자동화 및 로깅 체계 확정](2026-08-25) → [배치 스케줄링 조정](2026-08-26): 코드 분석
# 기반 분류 — open_spaces 테이블로만 적재하는(events와 무관한) API 전체를
# scripts/ingest/run-monthly.mjs 한 번의 실행으로 순차 처리한다. 분류 근거(각 파일의
# targetTable을 직접 조사)는 run-monthly.mjs 상단 주석 참고.
#
# 고정 장소/시설 데이터(open_spaces)는 변경 빈도가 매우 낮은 데이터 특성을 반영해, 최초
# 구축한 Weekly(주간) 스케줄을 이번 지시로 Monthly(월 1회)로 전환한다 — API 호출 낭비와
# DB 부하를 줄이는 것이 목적이며, 대상 API 목록/분류 기준 자체는 변경 없음.
#
# [배치 스케줄링 조정 - cron 정밀화](2026-08-26): "KST 매월 1일 새벽 02:00에 정확히
# 맞춰 실행"이 목표. GitHub Actions의 schedule cron은 Quartz가 아니라 표준 5필드 POSIX
# cron(vixie-cron 방언)이라 'L'(마지막 날) 토큰을 지원하지 않는다 — `0 17 L * *`를 그대로
# 쓰면 워크플로 자체가 파싱 실패하거나 트리거되지 않는다(실제 GitHub Actions 문서 기준
# 사실 확인, 추측 아님). 대신 GitHub Actions에서 널리 쓰이는 표준 우회법을 적용한다:
# 매월 28~31일에 매일 후보로 깨어나되, 아래 "Check last day of month" 스텝에서
# "내일(UTC)이 1일인지"를 확인해 진짜 마지막 날에만 실제 배치를 실행한다 — 28~31일 중
# 그 달의 마지막 날 단 하루만 조건이 참이 되므로 결과적으로 "매월 1일 KST 새벽 시간대
# 정확히 1회 실행"과 수학적으로 동일하다. 이 판정은 UTC 날짜 단위로만 동작하므로 같은
# UTC 날짜 안에서는 시(hour)를 몇 시로 두든 결과에 영향이 없다. workflow_dispatch(수동
# 실행)는 이 가드를 건너뛰어 언제든 즉시 실행 가능하게 한다.
# [파이프라인 관측성 긴급 복구](2026-08-28): ingest-daily.yml과 동일한 문제 — 이 워크플로도
# docs/pipeline-log.md 변경분을 저장소에 커밋/푸시하는 스텝이 없어 실제 실행 여부를 사후에
# 확인할 수 없었다. 상세 배경은 ingest-daily.yml 상단 주석 참고.
# [cron 정각 트리거 회피](2026-08-28): ingest-daily.yml과 동일한 사유(GitHub Actions 공식
# 문서상 정시 트리거는 부하로 지연/드롭될 수 있음) — 상세 배경은 ingest-daily.yml 상단 주석
# 참고. "내일이 1일인지" 가드 로직(28~31일 매일 후보로 깨어남)은 시각과 무관하므로 분만
# 옮겨도 동일하게 동작한다.
# [크론 스케줄 KST 새벽 3시대 재조정](2026-08-28): daily(KST 03:07)와 동일한 "새벽 3시대 +
# 비정규 분" 기준으로 통일한다. KST 기준 새벽 3시 13분 (UTC 18:13) — 기존 02:07 KST에서
# 이동하되, "내일이 1일인지" 판정은 UTC 날짜 기준이라 같은 28~31일 UTC 범위 안에서는 시각
# 변경이 말일 감지 로직에 영향을 주지 않는다.
# [배치 시간 2~4시대 분산 재조정](2026-09-01 사용자 지시): daily를 2시 47분으로 당기면서
# 이 배치와 겨우 6분 차이로 붙어 있던 문제를 해소하기 위해, 이 배치는 KST 새벽 3시 52분
# (UTC 18:52)으로 더 늦춰 daily와 실제로 멀리 떨어뜨렸다("내일이 1일인지" 판정은 UTC
# 날짜 기준이라 시각 변경이 말일 감지 로직에 영향을 주지 않는다).
permissions:
  contents: write

on:
  schedule:
    - cron: '52 18 28-31 * *'
  workflow_dispatch:

jobs:
  monthly-spaces-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [핵심 events 수집 파이프라인 장애 점검](2026-08-30 사용자 지시) 실측 발견: ingest-daily.yml과
      # 동일한 원인("Node.js detected but native WebSocket not found" — @supabase/supabase-js
      # 2.112.3의 engines가 node >=22.0.0을 요구) — 상세 배경은 ingest-daily.yml 상단 주석 참고.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check last day of month (UTC)
        id: last_day
        run: |
          tomorrow_day=$(date -u -d '+1 day' +%d)
          if [ "$tomorrow_day" = "01" ]; then
            echo "is_last_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_last_day=false" >> "$GITHUB_OUTPUT"
          fi

      # [수집 파이프라인 자동 재시도 메커니즘](2026-08-28): ingest-daily.yml과 동일한 사유·전략 —
      # 코드 레벨 재시도(scripts/ingest/lib/retry.mjs)로 흡수 못 하는 광범위 장애(DB 전체 장애,
      # 러너 네트워크 단절 등)에 대비해 1차 실패 시 15분 대기 후 전체를 1회 재실행한다. upsert가
      # external_id 기준 멱등 연산이라 재실행으로 인한 데이터 손상 위험이 없다.
      - name: Monthly Spaces Batch (CITY_PARK/CULTURE_FACILITY/CULTURAL_FACILITY_SUMMARY/LOCALDATA_AMUSEMENT/GG_EVENTS/GO_CAMPING/NATIONAL_PARK_ECOTOUR/LOCALDATA_PLAYGROUND/PUBLIC_FACILITY_OPEN/SWIMMING_POOL/KOR_TOUR/KOR_WITH_TOUR/KOR_PET_TOUR)
        if: steps.last_day.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          # [핵심 events 수집 파이프라인 장애 점검](2026-08-30 사용자 지시) 실측 발견: 이 워크플로가
          # RURAL_EDUCATION_FARM(농사로 API, 2026-08-29 신규 추가)을 실행하는데도 이 시크릿이
          # env 블록에 빠져 있어, GitHub Actions에서는 이 소스만 매번 조용히 실패하고 있었다
          # (로컬 .env.local에는 있어 로컬 실행/테스트에서는 드러나지 않던 문제).
          NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}
        run: |
          set +e
          node scripts/ingest/run-monthly.mjs
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "⚠️ 1차 실행 실패(exit $exit_code) — 15분 대기 후 1회 재시도합니다."
            sleep 900
            node scripts/ingest/run-monthly.mjs
            exit_code=$?
          fi
          exit $exit_code

      # [워크플로 푸시 경합 수정](2026-08-30 실측 발견, ingest-daily.yml과 동일한 사유):
      # main에 다른 커밋이 그 사이 올라오면 단순 `git push`는 non-fast-forward로 거부되고
      # 러너 워크스페이스가 잡 종료와 함께 사라져 이 배치 리포트가 통째로 유실된다 — 실패
      # 시 최신 main으로 rebase한 뒤 재시도한다(docs/pipeline-log.md는 이 워크플로만
      # 건드리는 파일이라 rebase 충돌 위험이 매우 낮음).
      - name: Commit pipeline log
        if: always() && (steps.last_day.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/pipeline-log.md; then
            git add docs/pipeline-log.md
            git commit -m "docs: [Actions] Monthly Spaces Batch 실행 리포트 - $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "⚠️ 푸시 실패($i/5) — main이 그 사이 앞서나갔을 수 있어 rebase 후 재시도합니다."
              git fetch origin main
              git rebase origin/main
            done
            echo "❌ 5회 재시도에도 푸시 실패 — 배치 리포트가 저장소에 반영되지 못했습니다."
            exit 1
          else
            echo "docs/pipeline-log.md 변경 없음 — 커밋 스킵"
          fi

name: Monthly Data Ingestion (Open Spaces)

# spec/data/data_sources.md: 공간형 데이터 3종은 매월 1일 03:00~04:00 KST 동기화.
# GitHub Actions cron은 UTC 기준이라 '0 0 1 * *'(UTC 00:00, 매월 1일)로 실행하면
# KST로는 09:00 매월 1일에 해당한다. 정확한 03시가 아니라 09시가 되지만
# "매월 1일"이라는 날짜 요건은 그대로 지켜지며, 월 1회 배치 작업 특성상
# 시각 차이는 서비스에 영향을 주지 않는다.
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  ingest-open-spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Source 01 - 전국 도시공원 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/city-park.mjs

      - name: Source 03 - 서울시 문화공간 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
        run: node scripts/ingest/cultural-spaces.mjs

      # 사용자 지시(2026-08-22): 전체 어댑터 일반 정책 점검에서 발견 — 아래 3개는 코드가 이미
      # 완성돼 있고(페이지네이션 포함) 실제 라이브 호출도 정상 동작하는데, 지금까지 어떤
      # 워크플로에도 연결돼 있지 않아 DB에 단 한 건도 적재된 적이 없었다(실측 확인: 수동
      # 재실행으로 전량 최초 적재 완료 — 놀이시설 82,373건 포함). 공간형 데이터(변동 주기 김)라
      # Source 01/03과 동일하게 월 1회 스케줄에 편입한다.
      - name: 전국 유원시설(놀이공원) 업체 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/amusement-park.mjs

      - name: 전국 어린이놀이시설 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/playground.mjs

      - name: 전국 공공시설 개방 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/public-facility-open.mjs

      # 같은 점검에서 함께 발견: 이미 데이터가 있어(수동 실행 이력) "0건"은 아니었지만 마찬가지로
      # 자동 스케줄에 연결돼 있지 않아 이후 갱신이 전혀 되지 않고 있었다.
      - name: 전국 수영장 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/ingest/swimming-pool.mjs

      - name: 경기도 물놀이형 수경시설 정보
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GG_DATA_API_KEY: ${{ secrets.GG_DATA_API_KEY }}
        run: node scripts/ingest/gg-events.mjs

      # Source 02(전국 공공체육시설 현황)는 서울시 서버 측 장애(ERROR-500)로 보류 중.
      # implementation/todo.md 참고. 서버 정상화 확인 후 이 워크플로에 스텝 추가 예정.
      # national-park-ecotour.mjs(KAKAO_REST_API_KEY 미설정)는 필수 환경변수가 없어
      # 이번 점검에서 스킵함(todo.md 스킵 로그 참고, 임의로 값을 추측해 넣지 않음).
      # Task 9-6-1(2026-08-22): local-data-kids.mjs/LocalDataKidsAdapter는 원본 소스인
      # localdata.go.kr 자체가 서비스 폐기(접속 불가, 실측 확인 — ECONNREFUSED)돼 완전히
      # 폐기했다(어댑터 파일 삭제, ingest:local-data-kids 스크립트 제거).

name: Emart Culture Club Batch

# [이마트 컬처클럽 강좌 리스트 일일 배치](2026-10-03 사용자 지시): "이마트 문화센터
# 등 다른곳에 대하여 홈플러스처럼 진행할예정이야" — 홈플러스와 가장 큰 차이는 로그인
# 세션이나 Playwright가 전혀 필요 없다는 점이다. 실측 확인(2026-10-03): 사이트
# 진입 시 reCAPTCHA/NetFunnel(가상 대기열)이 뜨지만, 이건 웹페이지 로드 보호용이고
# 실제 강좌 데이터는 공개 AWS AppSync GraphQL API를 직접 호출해서 받아온다 — API
# 키가 이마트 프론트엔드 JS 번들에 그대로 포함된 공개 키라 브라우저/세션 없이 순수
# HTTP 요청만으로 동작한다. 그래서 홈플러스처럼 "회원님 PC에서만" 돌릴 필요가 없고,
# 다른 소스들과 동일하게 GitHub Actions에서 완전 자동 실행한다.
#
# [매너 있게 수집](사용자 지시): 페이지 요청 사이에 고정 딜레이(500ms)를 둬서
# 짧은 시간에 과도하게 몰아치지 않는다(emart-culture-club.mjs 내부 구현).
#
# 크론 시간: 기존 daily(17:47 UTC)/monthly(18:52 UTC)/홈플러스(중단됨)와 겹치지
# 않게 KST 새벽 4시(UTC 19:00)로 분산.
#
# [schedule 트리거 비활성화](2026-10-06 사용자 지시: "github action 수동 실행으로
# 확인결과 여전히 에러남" — 하기사항을 확인하고 이마트쪽은 어떻게 수집하면 좋을지
# 다시 제안): 지점 64개를 15개씩 5묶음으로 나눈 수정(2026-10-05, 커밋 a9484e8)도
# WAFForbiddenException(403)을 해결하지 못했다(사용자가 직접 workflow_dispatch로
# 재현해 에러 로그를 그대로 붙여넣어 확인) — 같은 IP/키로 classId 단건 조회(상세
# 배치)는 항상 성공하는데, classStatus 필터가 들어간 이 쿼리만 막히는 걸 보면
# WAF가 요청 크기보다 "이 필터 조합/반복 호출 패턴" 자체를 걸러내는 것으로 보인다
# (추가 유료 프록시 없이는 GitHub Actions 쪽에서 더 시도할 free 옵션이 없다).
# 사용자 결정: "로컬 PC에서 새벽배치 및 주기적 실행 + PC 부팅시 1회 실행"으로
# 임시 전환(scripts/ingest/emart-culture-club.mjs를 그대로 재사용, Windows
# 작업 스케줄러 "LocalOpenSpaces-EmartBatch"/"LocalOpenSpaces-EmartBatch-OnBoot"
# 로 실행). schedule 트리거만 꺼둔다 — workflow_dispatch는 남겨서 나중에
# 프록시 등으로 전환 시 그대로 재활성화할 수 있게 한다.
on:
  # schedule:
  #   - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  emart-culture-club-batch:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EMART_CULTURE_CLUB_API_KEY: ${{ secrets.EMART_CULTURE_CLUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # [가벼운 1회 재시도] 홈플러스/서울 공영주차장과 동일한 사유 — 선택자/타이밍성이
      # 아니라 외부 API 일시 장애만 흡수하면 되는 가벼운 배치라 짧게(2분) 대기 후
      # 1회만 재시도한다.
      - name: Run Emart Culture Club collection
        run: |
          set +e
          node scripts/ingest/emart-culture-club.mjs
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "⚠️ 1차 실행 실패(exit $exit_code) — 2분 대기 후 1회 재시도합니다."
            sleep 120
            node scripts/ingest/emart-culture-club.mjs
            exit_code=$?
          fi
          exit $exit_code

name: Lottemart Culture Club Status Watch (Every 5 min)

# [찜한 롯데마트 강좌 상태 변화 알림](2026-10-04 사용자 지시): "나도 상태
# 변화 알림이 좋을것 같지만 그경우 일 1회 배치로는 크게 의미가 없어 이경우 좀
# 자주 가져오던가 해야해" — 전체 카탈로그(60개 지점)를 자주 재스캔하는 대신,
# 찜한 소수 class_id만 상세 페이지로 개별 재확인한다. 요청량이 "지점 수"가
# 아니라 "실제 찜된 class_id 수"에 비례한다 — 60개 지점 ping(지점 수 고정)과
# 근본적으로 다른 비용 구조.
#
# [5분 주기 — 사용자 확정](2026-10-04): "찜한 목록에 대하여서는 더 자주 상태
# 변화 감지 가능할까?" — 실측 확인: 기능이 막 나온 시점이라 현재 찜된 롯데
# 마트 강좌가 0건이다. 0건 기준으로는 어떤 주기든 비용이 거의 없어, 처음부터
# 더 타이트하게(이벤트 예약 알림과 동일한 5분) 잡았다. 찜 개수가 실제로
# 수백~수천 건 수준으로 늘어나면(예: 500건 × 분당 체크 = 과도한 요청) 그때
# 가서 주기를 늘리거나 찜 개수 기준 적응형 로직을 추가해야 한다 — 지금은
# 그 임계값을 추측으로 미리 설계하지 않는다(제3장 제5조, 실측 후 판단).
permissions:
  contents: read

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  lottemart-culture-club-status-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Watch bookmarked Lottemart classes for status changes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/ingest/lottemart-culture-club-status-watch.mjs
